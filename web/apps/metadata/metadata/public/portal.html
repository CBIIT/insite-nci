<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="NIFE, Search Portal" />
    <title>INSITE - Image Search Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../static/metadata/styles.css" />
    <style>
      .bg-gradient-custom {
        background: linear-gradient(to bottom right, #f8f9fa, #e9ecef);
      }
      .search-container {
        position: relative;
      }
      .search-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #6c757d;
      }
      .search-input {
        padding-left: 45px;
      }
      .card {
        transition: all 0.3s ease;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }
      .result-card-image {
        height: 180px;
        object-fit: cover;
        background: linear-gradient(to bottom right, #e9ecef, #dee2e6);
        position: relative;
        overflow: hidden;
      }
      .result-card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }
      .card:hover .result-card-image img {
        transform: scale(1.05);
      }
      .thumbnail-loading {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(233, 236, 239, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .result-count {
        font-size: 0.85rem;
        color: #6c757d;
      }
      .view-toggle .btn.active {
        background-color: #e9ecef;
        color: #495057;
      }
      .algorithm-badge {
        font-size: 0.7rem;
        padding: 0.25rem 0.5rem;
      }
      .quality-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 0.75rem;
        padding: 0.35rem 0.7rem;
      }
    </style>
  </head>
  <head>
    <title>Portal</title>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <style type="text/css">
      body {
        padding-right: 0px !important;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="min-vh-100 d-flex flex-column bg-gradient-custom">
  
    <div id="portal-root"></div>
    <!--
      This HTML file is a template.

    -->
  </body>
</html>
